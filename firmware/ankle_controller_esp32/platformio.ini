; PlatformIO project for the active ankle controller.
;
; The 2021 project was built in the Arduino IDE; this file exists so the ported
; C++ sources build from the command line with the same libraries and board.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    br3ttb/PID@^1.2.1
    olkal/HX711_ADC@^1.2.12
    https://github.com/TridentTD/TridentTD_EasyFreeRTOS32.git
    https://github.com/Seeed-Studio/Seeed_Arduino_AS5600.git
